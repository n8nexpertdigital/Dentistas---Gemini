# Publica o site estático no GitHub Pages.
#
# Passo manual necessário uma única vez:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# (O token do Actions não tem permissão para ligar o Pages sozinho neste
# repositório: "Create Pages site failed: Resource not accessible by integration".)
name: Deploy no GitHub Pages

on:
  push:
    branches:
      - main
      - claude/insurance-company-website-so4fnt
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
